<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040">
<title>Mini MapReduce word count architecture</title>
<desc>Input is split into three chunks mapped independently, then shuffled, grouped, and reduced to final word counts. Local process simulation.</desc>
